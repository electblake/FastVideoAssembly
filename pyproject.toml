[project]
name = "fastvideoassembly"
version = "0.8.8"
description = "Assemble portrait videos into balanced side-by-side timelines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "pyqtgraph>=0.13.7,<0.15",
    "platformdirs>=4",
    "qt-themes>=0.4.1,<0.5",
    "requests>=2.32,<3",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "onnxruntime>=1.31.0",
    "huggingface-hub>=2.3.0",
    "numpy>=2.5.4",
    "uv>=0.13.5",
    "python-ffmpeg>=2.0.12",
    "pywin32>=312",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.gui-scripts]
fastvideoassembly = "fastvideoassembly.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.9"]

[tool.pytest.ini_options]
qt_api = "pyside6"
markers = ["profile: exercise persistence using an isolated temporary user profile"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
